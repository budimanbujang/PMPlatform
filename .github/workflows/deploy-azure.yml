# Builds the Next.js app and deploys to Azure App Service.
# Triggered on push to the development branch; can also be invoked manually.
#
# Prerequisites (one-off, done by you in Azure + GitHub — see AZURE_DEPLOY.md):
#   - Azure App Service created (Linux, Node 20)
#   - Publish profile downloaded from Azure and pasted into GitHub
#     as repo secret  AZUREAPPSERVICE_PUBLISHPROFILE
#   - Env vars set directly in App Service → Configuration
#     (NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#      SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY, RESEND_API_KEY,
#      CRON_SECRET, NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_APP_NAME)

name: Deploy to Azure App Service

on:
  push:
    branches:
      - claude/digital-pmo-platform-rBHme
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: bbai          # ← update if your App Service has a different name
  NODE_VERSION: "20.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        # No lock file in the repo yet → use `npm install` instead of `npm ci`.
        # Once the first green build runs, commit the generated package-lock.json
        # and switch this back to `npm ci` for reproducible builds.
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # Build-time public vars — pulled from GitHub secrets so the
          # Next.js client bundle is compiled with the right values.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: BB AI

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package artifact
        # App Service expects a zipped deployment. Include the standalone
        # output + required runtime files. The lock file is optional —
        # include it only if it exists so we don't fail when it doesn't.
        run: |
          files=".next public node_modules package.json next.config.mjs"
          [ -f package-lock.json ] && files="$files package-lock.json"
          # `public/` is optional — Next 14 doesn't require it.
          [ -d public ] || files=$(echo "$files" | sed 's| public||')
          zip -r deploy.zip $files -x "*.map" -x ".next/cache/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: deploy.zip
